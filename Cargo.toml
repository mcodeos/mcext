[package]
name = "mcodels"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# mcc dependency removed - all interactions via RPC
ropey = "1.5.0"
serde_json = "1.0.78"
tokio = { version = "1.17.0", features = ["full"] }
tower-lsp = { version = "0.20.0", features = ["proposed"]}
serde = { version = "1.0", features = ["derive"] }
dashmap = "6.1.0"
anyhow = "1.0.93"

# tracing: structured logging + span support
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# RPC client for mcc server
reqwest = { version = "0.12", features = ["json"] }

# TOML parsing for project manifests (project.toml / manifest.toml / mcc.toml).
# preserve_order: [dependencies] must keep the manifest's authoring order —
# lib.load resolves `use` targets against previously loaded libs, so an
# alphabetized map loads project libs before the mcode/mclibs they use and
# every class binding silently collapses to a stub (b4557-era E4007 storm).
toml = { version = "0.8", features = ["preserve_order"] }

